<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Join a HarvestTime table</title>
<style>
  :root { --bg:#f3efe2; --card:#fffdf6; --green:#3f6b2a; --green-dark:#2d4f1d; --soil:#6b4f32; --text:#2b2a22; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width:min(92vw, 440px); background:var(--card); border:2px solid #d9cfb4; border-radius:18px;
         padding:28px 24px; text-align:center; box-shadow:0 6px 24px rgba(60,50,20,.12); }
  h1 { margin:0 0 6px; font-size:1.6rem; color:var(--green-dark); }
  p { margin:8px 0; line-height:1.45; }
  .btn { display:block; width:100%; margin:14px 0 0; padding:16px; border:0; border-radius:12px; font-size:1.15rem;
         font-weight:700; text-decoration:none; cursor:pointer; }
  .primary { background:var(--green); color:#fff; font-size:1.3rem; padding:20px; }
  .primary:active { background:var(--green-dark); }
  .secondary { background:#e8e0c8; color:var(--soil); }
  .get { display:inline-block; margin-top:18px; color:var(--green); font-weight:600; }
  .msg { min-height:1.4em; font-size:.95rem; color:var(--soil); }
  .err { color:#8a2b1a; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>🌱 HarvestTime</h1>
  <div id="ok" hidden>
    <p>You've been invited to a HarvestTime table.</p>
    <button id="open" class="btn primary" type="button">Open HarvestTime</button>
    <a id="get" class="btn secondary" href="#">Get HarvestTime</a>
    <p id="msg" class="msg" aria-live="polite"></p>
    <p style="font-size:.9rem">New to HarvestTime? Tap <b>Get HarvestTime</b> &mdash; the invite is copied for you. After installing, open HarvestTime and tap <b>Join copied invite?</b></p>
  </div>
  <div id="bad" hidden>
    <p class="err">This invite link looks incomplete. Ask your friend to share it again.</p>
  </div>
</main>
<script>
// ---- Config: set the real download pages here ----
var ANDROID_DOWNLOAD_URL = "#TODO";  // e.g. Play Store / APK download page
var WINDOWS_DOWNLOAD_URL = "#TODO";  // e.g. Windows installer / zip download page
var ANDROID_PACKAGE = "com.DefaultCompany.urp_2d"; // PlayerSettings applicationIdentifier (Android)
// ---------------------------------------------------
// Everything stays on this device: no analytics, no external scripts, no network requests.
// The invite code lives in the URL fragment (#c=...), which browsers never send to the web server.
(function () {
  function readCode() {
    var src = (location.hash || "").replace(/^#/, "");
    if (!src) src = (location.search || "").replace(/^\?/, "");
    var parts = src.split("&");
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].slice(0, 2).toLowerCase() !== "c=") continue;
      var v;
      try { v = decodeURIComponent(parts[i].slice(2)); } catch (e) { continue; }
      v = v.trim();
      if (/^HTR1\.[A-Za-z0-9_-]{20,200}$/.test(v)) return v;
    }
    return null;
  }
  var code = readCode();
  if (!code) { document.getElementById("bad").hidden = false; return; }
  document.getElementById("ok").hidden = false;

  var enc = encodeURIComponent(code);
  var inviteText = "Join my HarvestTime table: https://crazycanadia.github.io/harvesttime/join/#c=" + enc;
  var ua = navigator.userAgent;
  var isAndroid = /Android/i.test(ua);
  var isWindows = /Windows/i.test(ua) && !/Windows Phone/i.test(ua);
  var downloadUrl = isAndroid ? ANDROID_DOWNLOAD_URL : WINDOWS_DOWNLOAD_URL;
  var appLink = "harvesttime://join?c=" + enc;
  var openLink = isAndroid
    ? "intent://join?c=" + enc + "#Intent;scheme=harvesttime;package=" + ANDROID_PACKAGE +
      (ANDROID_DOWNLOAD_URL.charAt(0) === "#" ? "" : ";S.browser_fallback_url=" + encodeURIComponent(new URL(ANDROID_DOWNLOAD_URL, location.href).href)) + ";end"
    : appLink;

  var msg = document.getElementById("msg");
  var get = document.getElementById("get");
  get.href = downloadUrl;
  get.textContent = isAndroid ? "Get HarvestTime for Android" : isWindows ? "Download HarvestTime for Windows" : "Get HarvestTime";

  // Copy the full invite so the app finds it on first launch after install ("Join copied invite?").
  function copyInvite() {
    function note(ok) { msg.textContent = ok ? "Invite copied. Open HarvestTime after installing and tap Join." : "Couldn't copy automatically. Keep this page and tap Open HarvestTime after installing."; }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = inviteText; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); note(ok);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(inviteText).then(function () { note(true); }, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  document.getElementById("open").addEventListener("click", function () {
    copyInvite(); // user gesture: clipboard allowed; covers the not-installed case
    window.location.href = openLink;
    if (!isAndroid) {
      // Desktop: if the app did not take focus, show the download option prominently.
      var t = setTimeout(function () {
        if (!document.hidden) { get.className = "btn primary"; msg.textContent += " Not installed? Download it below."; }
      }, 2000);
      window.addEventListener("blur", function () { clearTimeout(t); }, { once: true });
    }
  });
  get.addEventListener("click", function () { copyInvite(); });

  // Try to open the app right away (works when installed; browsers may ask "Open HarvestTime?").
  try { window.location.href = openLink; } catch (e) {}
})();
</script>
</body>
</html>
